name: Sync 

on:
  schedule:
    - cron: '0 3 * * *' 
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync upstream
        uses: wei/git-sync@v3
        with:
          source_repo: 7Sageer/sublink-worker
          source_branch: main
          destination_repo: co2f2e/sublink-worker
          destination_branch: main
          github_token: ${{ secrets.MY_GITHUB_TOKEN }}
